services:
  db:
    image: postgres:latest
    container_name: "tcom-db"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tcom-db
    restart: always

    volumes:
      - tcomdata:/var/lib/postgres/data
    ports:
      - 5432:5432

volumes:
  tcomdata:
    driver: local
